name: Reusable SemVer Release Engine

on:
  workflow_call:
    inputs:
      build_command:
        description: "The terminal command used to compile the production binary (e.g., 'make target' or 'cmake --build .')"
        required: false
        type: string
        default: "make clean && make target"
      artifact_path:
        description: "The directory or file path of the compiled binaries to attach to the GitHub Release"
        required: false
        type: string
        default: "build/*"
    secrets:
      # Required so the workflow can automatically read secrets from the repository calling it
      RELEASE_TOKEN:
        required: true

permissions:
  contents: write 

jobs:
  release:
    name: Generate SemVer Release & Production Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # Note: For reusable workflows across different projects, it is highly recommended 
      # to use standard public actions for toolchains (like setup-arm-toolchain) rather 
      # than local paths (./.github/actions/...) to ensure it resolves correctly 
      # regardless of which repository calls this template.
      - name: Setup Embedded Toolchains
        uses: carlosperate/arm-none-eabi-gcc-action@v1 # Example public action
        with:
          release: 'latest'

      - name: Compile Production Binary
        if: inputs.build_command != ''
        run: |
          ${{ inputs.build_command }}
          echo "Production build completed for SemVer tag: $(git describe --tags)"

# Step 1: Overwrite the physical CHANGELOG.md with the full history
      - name: Update physical CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: -vv -o CHANGELOG.md

      # Step 2: Generate the temporary file for the GitHub Release page body
      - name: Generate temporary release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      # Step 3: Open a PR to merge CHANGELOG.md back to main
      - name: Create Pull Request for CHANGELOG
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(ci): update CHANGELOG.md for ${{ github.ref_name }}"
          title: "chore(ci): update CHANGELOG.md for ${{ github.ref_name }}"
          branch: update-changelog-${{ github.ref_name }}
          base: main
          body: |
            Automated PR to sync the physical CHANGELOG.md file after the release of ${{ github.ref_name }}.

      - name: Publish GitHub Release & Attach Firmware
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: ${{ inputs.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}